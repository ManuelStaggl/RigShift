name: Game template request
description: Add a game to the automation's list
title: "Game template: "
labels: [enhancement, good first issue]
body:
  - type: markdown
    attributes:
      value: |
        Templates live in `templates/games`, one JSON file per game. If you can, open a pull request with the file
        instead – see `templates/games/README.md`.
  - type: input
    id: game
    attributes:
      label: Game
      placeholder: RaceRoom Racing Experience
    validations:
      required: true
  - type: textarea
    id: executables
    attributes:
      label: Process names
      description: >-
        Start the game, open Task Manager → Details and copy the name of the game's own process (not the launcher,
        e.g. Steam or EA app). List every variant you know, e.g. a DirectX 11 and a VR executable.
      placeholder: RRRE64.exe
    validations:
      required: true
  - type: input
    id: store
    attributes:
      label: Store
      placeholder: Steam, Epic, EA app, standalone …
