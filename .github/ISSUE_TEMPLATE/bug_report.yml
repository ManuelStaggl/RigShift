name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Support package or diagnostics
      description: >
        In RigShift, **Help → Save support package** and drag the ZIP file in here. It holds the diagnostics, the last
        three logs, your settings, profiles and games, without your Windows user name. If you'd rather not share files,
        use **Help → Copy diagnostics** and paste the text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RigShift version
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Anything about your setup the package can't know
      description: How the monitors are connected (DisplayPort, HDMI, adapters, KVM), virtual displays (spacedesk, VR), what should happen on which screen.
