name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The NuGet cache is keyed on the lock files. Only here: the release workflow restores from nuget.org.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore RigShift.slnx

      # Code style and analyzers fail the build already (EnforceCodeStyleInBuild); whitespace is all that is left.
      - name: Check whitespace
        run: dotnet format whitespace RigShift.slnx --verify-no-changes

      - name: Build
        run: dotnet build RigShift.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test --solution RigShift.slnx --no-build -c Release
          --report-trx
          --coverage --coverage-output-format cobertura --coverage-settings "${{ github.workspace }}\coverage.settings"
          --results-directory "${{ github.workspace }}\TestResults"

      # Also after a failed test run: the TRX files say which test failed and why.
      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Restore tools
        run: dotnet tool restore

      # Coverage per assembly on the run's summary page. The floors are a ratchet: raise them when coverage grows.
      - name: Coverage summary and floors
        shell: pwsh
        run: |
          dotnet tool run reportgenerator "-reports:TestResults/*.cobertura.xml" "-targetdir:coverage" "-reporttypes:MarkdownSummaryGithub;JsonSummary"
          Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY
          $floors = @{ 'RigShift.Core' = 94; 'RigShift.Presentation' = 82; 'RigShift' = 1; 'RigShift.Windows' = 41 }
          $assemblies = (Get-Content coverage/Summary.json -Raw | ConvertFrom-Json).coverage.assemblies
          $low = foreach ($name in $floors.Keys) {
            $line = ($assemblies | Where-Object name -eq $name).coverage
            if ($null -eq $line -or $line -lt $floors[$name]) { "$name has $line % line coverage, the floor is $($floors[$name]) %" }
          }
          if ($low) { throw ($low -join "`n") }

      # Same publish as release.yml, so ReadyToRun errors show up before a tag. Then a start: a missing XAML resource
      # builds fine and only crashes at start.
      - name: Publish and start the app
        shell: pwsh
        run: |
          dotnet publish src/RigShift.Avalonia/RigShift.Avalonia.csproj -c Release -o publish
          ./publish/RigShift.exe --version | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "RigShift.exe --version ended with $LASTEXITCODE" }
          $app = Start-Process ./publish/RigShift.exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "RigShift.exe ended after start with $($app.ExitCode)" }
          Stop-Process -Id $app.Id

  # Windows 10 is supported but neither CI nor the author's PCs run it. Server 2022 (build 20348) shares its Windows 10
  # code base, so the tests running here show nothing assumes a Windows 11 API.
  windows-10-base:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Test
        run: dotnet test --solution RigShift.slnx -c Release

      # The display and audio reading on the Windows 10 code base, against the runner's virtual display.
      - name: Probe snapshot
        run: dotnet run --project tools/RigShift.Probe -c Release -- snapshot
