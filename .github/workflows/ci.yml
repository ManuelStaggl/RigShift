name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RigShift.slnx

      - name: Build
        run: dotnet build RigShift.slnx --no-restore -c Release

      - name: Test
        run: dotnet test --solution RigShift.slnx --no-build -c Release

      # Same publish as release.yml, so single-file or ReadyToRun errors show up before a tag.
      - name: Publish
        run: dotnet publish src/RigShift.App/RigShift.App.csproj -c Release -o publish
