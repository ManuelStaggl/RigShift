name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RigShift.slnx

      - name: Build
        run: dotnet build RigShift.slnx --no-restore -c Release

      - name: Test
        run: dotnet test --solution RigShift.slnx --no-build -c Release
